<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My English lessons – Grade 4</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1D2A5B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Farby (svetlý + tmavý režim) ===== */
:root {
  --ink:#1D2A5B; --paper:#EAF3FB; --card:#FFFFFF; --sun:#FFC53D; --sun-soft:#FFF1C9;
  --ok:#1E9E62; --ok-soft:#D6F5E6; --bad:#E0452B; --bad-soft:#FDE1DB; --line:#C9DCEE; --muted:#52618F;
  --robot:#7B61FF; --robot-soft:#ECE7FF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink:#E8EEFF; --paper:#111A38; --card:#1B2650; --sun-soft:#3A3420; --ok:#3DD68C; --ok-soft:#173D2E;
  --bad:#FF7A61; --bad-soft:#432420; --line:#2E3C70; --muted:#A9B5DD; --robot:#A895FF; --robot-soft:#2A2458; } }
:root[data-theme="dark"] { --ink:#E8EEFF; --paper:#111A38; --card:#1B2650; --sun-soft:#3A3420; --ok:#3DD68C; --ok-soft:#173D2E;
  --bad:#FF7A61; --bad-soft:#432420; --line:#2E3C70; --muted:#A9B5DD; --robot:#A895FF; --robot-soft:#2A2458; }
*,*::before,*::after { box-sizing:border-box; }
html { scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
body { margin:0; min-height:100%; background:var(--paper); color:var(--ink);
  font-family:"Atkinson Hyperlegible","Trebuchet MS",system-ui,sans-serif; font-size:20px; line-height:1.5; -webkit-tap-highlight-color:transparent; }
h1,h2,h3 { font-family:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif; line-height:1.1; margin:0; }
button { font:inherit; color:inherit; cursor:pointer; }
button:focus-visible { outline:4px solid var(--sun); outline-offset:3px; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

.wrap { max-width:860px; margin:0 auto; padding:16px 20px 48px; }
.topbar { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.spacer { flex:1; }
.iconbtn { min-width:56px; height:56px; padding:0 16px; border-radius:18px; border:3px solid var(--ink); background:var(--card);
  font-family:"Baloo 2",sans-serif; font-weight:700; font-size:20px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.iconbtn[aria-pressed="true"] { background:var(--sun); color:#1D2A5B; }
.sk { color:var(--muted); font-size:.85em; }
body:not(.show-sk) .sk { display:none; }
.big { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:64px; padding:0 28px; border-radius:22px;
  border:3px solid var(--ink); background:var(--sun); color:#1D2A5B; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:24px;
  box-shadow:0 5px 0 var(--ink); transition:transform .08s, box-shadow .08s; }
.big:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
.big.ghost { background:var(--card); color:var(--ink); }
.big:disabled { opacity:.45; }
.row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px; }

/* Domov: predmety a lekcie */
.hello h1 { font-size:clamp(40px,7vw,64px); font-weight:800; letter-spacing:-1px; }
.hello p { margin:4px 0 20px; }
.tabs { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
.tab { padding:10px 20px; border-radius:99px; border:3px solid var(--ink); background:var(--card); font-family:"Baloo 2",sans-serif; font-weight:700; font-size:22px; }
.tab[aria-selected="true"] { background:var(--ink); color:var(--paper); }
.unit-title { font-size:22px; font-weight:700; color:var(--muted); margin:22px 0 10px; font-family:"Baloo 2",sans-serif; }
.lessons { display:grid; gap:12px; }
.lesson { display:grid; grid-template-columns:64px 1fr auto; gap:14px; align-items:center; text-align:left; width:100%;
  padding:12px 16px; border-radius:24px; border:3px solid var(--ink); background:var(--card); }
.lesson .ico { width:64px; height:64px; border-radius:18px; background:var(--sun-soft); display:grid; place-items:center; font-size:40px; }
.lesson .ico svg { width:52px; height:52px; }
.lesson h3 { font-size:26px; font-weight:700; }
.lesson p { margin:0; font-size:16px; color:var(--muted); }
.lesson .st { font-size:22px; letter-spacing:1px; white-space:nowrap; }
.now { background:var(--sun-soft); border:3px solid var(--sun); border-radius:28px; padding:14px 14px 16px; margin-bottom:10px; }
.now-title { font-family:"Baloo 2",sans-serif; font-weight:800; font-size:26px; margin:0 4px 10px; }
.lesson.hot { box-shadow:0 5px 0 var(--ink); }
.home-actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px; }
.home-actions .big { width:100%; font-size:21px; padding:0 14px; }
.home-actions .big.fix { background:var(--bad-soft); color:var(--bad); border-color:var(--bad); box-shadow:0 5px 0 var(--bad); }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
.stat { background:var(--card); border:3px solid var(--ink); border-radius:22px; padding:14px; text-align:center; }
.stat b { display:block; font-family:"Baloo 2",sans-serif; font-size:42px; line-height:1; }
.prow { display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:10px 14px; background:var(--card); border-radius:16px; border:2px solid var(--line); font-size:18px; }
.pdots { display:flex; gap:4px; }
.pdots i { width:12px; height:12px; border-radius:50%; background:var(--line); display:block; }
.pdots i.on { background:var(--ok); }
.gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
.gallery figure { margin:0; background:var(--card); border:3px solid var(--ink); border-radius:18px; overflow:hidden; }
.gallery img { width:100%; display:block; background:#fff; }
.gallery figcaption { padding:6px 10px; font-size:16px; font-weight:700; }
.draw-tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
.swatch { width:48px; height:48px; border-radius:50%; border:3px solid var(--ink); }
.swatch[aria-pressed="true"] { outline:4px solid var(--sun); outline-offset:2px; }
.canvas-wrap { background:#fff; border:3px solid var(--ink); border-radius:24px; overflow:hidden; touch-action:none; }
.canvas-wrap canvas { display:block; width:100%; touch-action:none; }
.labels { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
.label-chip { padding:8px 16px; border-radius:99px; border:3px solid var(--ink); background:var(--card); font-family:"Baloo 2",sans-serif; font-weight:700; font-size:21px; }
.label-chip[aria-pressed="true"] { background:var(--sun); color:#1D2A5B; }
.label-chip.used { opacity:.45; }
.empty { padding:24px; border:3px dashed var(--line); border-radius:24px; text-align:center; color:var(--muted); }

/* Lekcia: cestička krokov */
.hero { display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:center; margin-bottom:24px; }
.hero-pic { width:130px; height:130px; display:grid; place-items:center; font-size:96px; line-height:1; }
.hero-pic svg { width:100%; height:100%; }
.hero h1 { font-size:clamp(38px,7vw,62px); font-weight:800; letter-spacing:-1px; }
.hero p { margin:6px 0 0; }
.path { display:grid; gap:12px; }
.step { display:grid; grid-template-columns:68px 1fr auto; align-items:center; gap:16px; width:100%; text-align:left;
  padding:12px 18px; border-radius:26px; border:3px solid var(--ink); background:var(--card); }
.step .num { width:68px; height:68px; border-radius:50%; display:grid; place-items:center; border:3px solid var(--ink);
  font-family:"Baloo 2",sans-serif; font-weight:800; font-size:32px; background:var(--paper); }
.step.done .num { background:var(--ok); color:#fff; border-color:var(--ok); }
.step.robot { border-color:var(--robot); }
.step.robot .num { border-color:var(--robot); }
.step h2 { font-size:28px; font-weight:700; }
.step p { margin:0; color:var(--muted); font-size:17px; }
.step .go { font-size:30px; }

/* Learn */
.screen-title { font-size:38px; font-weight:800; margin-bottom:4px; }
.lead { margin:0 0 18px; }
.flash { background:var(--card); border:3px solid var(--ink); border-radius:32px; padding:28px 20px; text-align:center; min-height:370px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
.pic { display:grid; place-items:center; line-height:1; color:var(--ink); }
.pic svg { width:100%; height:100%; }
.flash .pic { width:160px; height:160px; font-size:118px; }
.flash .word { font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(40px,9vw,64px); }
.flash .trans { font-size:26px; color:var(--muted); min-height:40px; }
.flash .ex { font-size:20px; max-width:34ch; }
.dots { display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
.dot { width:14px; height:14px; border-radius:50%; background:var(--line); }
.dot.on { background:var(--ink); }

/* Read */
.reader { background:var(--card); border:3px solid var(--ink); border-radius:28px; padding:24px 26px; font-size:24px; line-height:1.75; }
.reader p { margin:0 0 16px; }
.w { border:none; background:var(--sun-soft); border-bottom:3px dashed var(--ink); padding:0 4px; border-radius:6px; font-weight:700; }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--card); border-top:3px solid var(--ink);
  padding:18px 24px calc(18px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:16px; justify-content:center; box-shadow:0 -8px 30px rgba(0,0,0,.15); }
.sheet .pic { width:66px; height:66px; font-size:52px; }
.sheet b { font-family:"Baloo 2",sans-serif; font-size:32px; display:block; line-height:1; }

/* Cvičenia */
.progress { height:14px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:20px; }
.progress span { display:block; height:100%; background:var(--ok); border-radius:99px; transition:width .3s; }
.panel { background:var(--card); border:3px solid var(--ink); border-radius:28px; padding:22px; }
.choice { min-height:72px; padding:10px 18px; border-radius:20px; border:3px solid var(--ink); background:var(--card);
  font-family:"Baloo 2",sans-serif; font-weight:700; font-size:24px; display:flex; align-items:center; justify-content:center; gap:10px; text-align:center; line-height:1.2; }
.choice.sel { background:var(--sun); color:#1D2A5B; }
.choice.ok { background:var(--ok-soft); border-color:var(--ok); color:var(--ok); }
.choice.bad { background:var(--bad-soft); border-color:var(--bad); color:var(--bad); }
.choice.gone { opacity:.35; }
.choice .pic { width:60px; height:60px; font-size:48px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grid1 { display:grid; gap:12px; }
.shake { animation:shake .35s; }
@keyframes shake { 25% { transform:translateX(-8px);} 75% { transform:translateX(8px);} }
.feedback { min-height:44px; text-align:center; font-family:"Baloo 2",sans-serif; font-weight:700; font-size:24px; margin-top:14px; }
.feedback.ok { color:var(--ok); } .feedback.bad { color:var(--bad); }
.explain { text-align:center; font-size:20px; margin-top:4px; }
.match { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.match .col { display:grid; gap:12px; }
.sort-item { text-align:center; margin-bottom:16px; }
.sort-item .pic { font-size:100px; height:110px; }
.sort-item .name { font-family:"Baloo 2",sans-serif; font-weight:800; font-size:38px; }
.bin { flex-direction:column; min-height:130px; }
.bin .pic { width:76px; height:76px; font-size:60px; }
.sentence { font-size:28px; line-height:1.5; text-align:center; margin:10px 0 24px; }
.blank { display:inline-block; min-width:140px; border-bottom:4px solid var(--ink); text-align:center; font-weight:700; }

/* Robot – AI zručnosti */
.robot-say { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start; margin-bottom:18px; }
.robot-face { width:84px; height:84px; border-radius:24px; background:var(--robot); color:#fff; display:grid; place-items:center; font-size:54px; }
.bubble { background:var(--robot-soft); border:3px solid var(--robot); border-radius:6px 26px 26px 26px; padding:16px 20px; font-size:24px; line-height:1.4; }
.tipbox { margin-top:16px; padding:14px 18px; border-radius:18px; background:var(--sun-soft); font-size:19px; }
.qcard { text-align:left; justify-content:flex-start; font-family:"Atkinson Hyperlegible",sans-serif; font-weight:700; font-size:21px; }

/* Test + výsledok */
.q-pic { width:150px; height:150px; margin:0 auto 10px; font-size:112px; }
.q-text { font-family:"Baloo 2",sans-serif; font-weight:700; font-size:30px; text-align:center; margin-bottom:20px; line-height:1.2; }
.result { text-align:center; }
.big-stars { font-size:80px; letter-spacing:8px; margin:10px 0; }
.score { font-family:"Baloo 2",sans-serif; font-size:60px; font-weight:800; }
.review { text-align:left; margin-top:20px; display:grid; gap:10px; }
.review div { padding:12px 16px; border-radius:16px; background:var(--bad-soft); font-size:19px; }

@media (max-width:560px) {
  body { font-size:18px; }
  .hero { grid-template-columns:1fr; text-align:center; } .hero-pic { margin:0 auto; width:100px; height:100px; font-size:76px; }
  .step { grid-template-columns:54px 1fr auto; } .step .num { width:54px; height:54px; font-size:24px; }
  .choice { font-size:21px; } .sentence { font-size:23px; } .bubble { font-size:20px; }
}
</style>
</head>
