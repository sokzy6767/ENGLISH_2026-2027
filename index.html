const APP = /*__DATA__*/{"subjects":[{"key":"science","name":"Science","sk":"Prírodoveda"},{"key":"art","name":"Art","sk":"Výtvarná výchova"},{"key":"mad","name":"MAD","sk":"Hudba, umenie, dráma"},{"key":"kidsbox","name":"Kid's Box 4","sk":"Angličtina"}],"lessons":[{"draw":{"labels":["magnet","north pole","south pole","paper clip","wood"],"task":"Draw a magnet with two poles. It attracts a paper clip, not wood.","taskSk":"Nakresli magnet s dvoma pólmi. Priťahuje sponku, drevo nie."},"gaps":[{"answer":"attract","options":["attract","eat","drink"],"text":"A magnet can ___ iron nails."},{"answer":"plastic","options":["plastic","iron","steel"],"text":"A magnet does not attract ___ cups."},{"answer":"south","options":["south","cold","big"],"text":"Every magnet has a north pole and a ___ pole."},{"answer":"push away","options":["push away","attract","melt"],"text":"Two north poles ___ each other."},{"answer":"paper","options":["paper","wood","glass"],"text":"A ___ clip jumps to a strong magnet."}],"icon":"🧲","id":"science-02","intro":"You will learn what a magnet attracts and how two magnets behave together.","reading":{"paragraphs":["A [magnet] is a special object. It can [attract] some things. A nail or a [paper clip] flies to the [magnet] and can [stick] to it.","A [magnet] attracts only some [metal] things. It likes [iron] and steel. It does not attract [plastic], [wood], glass or paper. Try it at home!","Not every [metal] is magnetic. Aluminium foil and copper coins do not [stick] to a [magnet]. Only some metals feel the magnet's power.","Every [magnet] has two ends. We call them the [north pole] and the [south pole]. Each [pole] is usually a different colour.","Now take two magnets. A [north pole] and a [south pole] [attract] each other. Two same poles [push away] each other. Try it!"],"title":"What Can a Magnet Do?","titleSk":"Čo dokáže magnet?"},"robot":{"prompts":[{"answer":"A magnet attracts iron and steel things: a nail, a paper clip, a key, scissors and a fridge door. Plastic, wood and paper do not stick to it.","bad":"magnet things?","goal":"Find out which things at home stick to a magnet.","goalSk":"Zisti, ktoré veci doma sa prilepia na magnet.","good":"Give me 5 things at home that a magnet attracts, for a 10-year-old.","tip":"It says how many, who for and what you need."},{"answer":"Step 1: Every magnet has a north and a south pole. Step 2: Different poles attract. Step 3: Same poles push away. Example: two north poles jump apart.","bad":"poles","goal":"Understand how two magnets behave.","goalSk":"Pochop, ako sa správajú dva magnety.","good":"Explain in 3 simple steps how two magnets behave, with one example.","tip":"It asks for steps and an example, so it is clear."}],"statements":[{"explain":"Yes, iron and steel things stick to a magnet.","ok":true,"text":"A magnet attracts iron and steel objects."},{"explain":"A magnet attracts only some metals, mainly iron and steel.","ok":false,"text":"A magnet attracts every metal, also aluminium foil and copper coins."},{"explain":"Different poles pull together.","ok":true,"text":"A north pole and a south pole attract each other."},{"explain":"Two same poles push away each other.","ok":false,"text":"Two south poles stick together very strongly."},{"explain":"A magnet never attracts wood, plastic or paper.","ok":false,"text":"A magnet also attracts wood, plastic and paper."}]},"sort":{"groups":[{"en":"A magnet attracts it","id":"yes","pic":"🧲"},{"en":"A magnet does not attract it","id":"no","pic":"🚫"}],"items":[{"en":"iron nail","group":"yes","pic":"🔩"},{"en":"paper clip","group":"yes","pic":"📎"},{"en":"key","group":"yes","pic":"🔑"},{"en":"scissors","group":"yes","pic":"✂️"},{"en":"plastic cup","group":"no","pic":"🥤"},{"en":"wood stick","group":"no","pic":"🪵"},{"en":"paper","group":"no","pic":"📄"},{"en":"apple","group":"no","pic":"🍎"}]},"subject":"science","test":[{"answer":"priťahovať","options":["priťahovať","odpudzovať","padať"],"q":"What does 'attract' mean?","qSk":"Čo znamená 'attract'?"},{"answer":"iron nails","options":["iron nails","plastic cups","wood sticks"],"q":"What does a magnet attract?","qSk":"Čo magnet priťahuje?"},{"answer":"two","options":["one","two","four"],"q":"How many poles does one magnet have?","qSk":"Koľko pólov má jeden magnet?"},{"answer":"false","options":["true","false"],"q":"A magnet attracts every metal.","qSk":"Magnet priťahuje každý kov."},{"answer":"true","options":["true","false"],"q":"Two north poles push away each other.","qSk":"Dva severné póly sa navzájom odpudzujú."},{"answer":"They attract.","options":["They attract.","They push away.","Nothing happens."],"q":"What happens when a north pole meets a south pole?","qSk":"Čo sa stane, keď sa stretne severný a južný pól?"},{"answer":"drevo","options":["drevo","plast","železo"],"q":"What is 'wood' in Slovak?","qSk":"Čo je 'wood' po slovensky?"},{"answer":"true","options":["true","false"],"q":"A paper clip can stick to a magnet.","qSk":"Kancelárska sponka sa môže prilepiť na magnet."}],"title":"Magic of Magnets","titleSk":"Kúzlo magnetov","unit":"1. We are looking for inanimate nature and natural phenomena","words":[{"en":"magnet","ex":"A magnet can pick up a nail.","pic":"🧲","sk":"magnet"},{"en":"attract","ex":"Magnets attract small iron objects.","pic":"🤝","sk":"priťahovať"},{"en":"push away","ex":"Two magnets can push away each other.","pic":"↔️","sk":"odpudzovať"},{"en":"metal","ex":"This spoon is made of metal.","pic":"🔩","sk":"kov"},{"en":"iron","ex":"Iron nails stick to a magnet.","pic":"⛓️","sk":"železo"},{"en":"pole","ex":"Every magnet has two poles.","pic":"🔴","sk":"pól"},{"en":"north pole","ex":"The north pole is often red.","pic":"🧭","sk":"severný pól"},{"en":"south pole","ex":"The south pole is often blue.","pic":"🔵","sk":"južný pól"},{"en":"paper clip","ex":"A paper clip jumps to the magnet.","pic":"📎","sk":"kancelárska sponka"},{"en":"plastic","ex":"A plastic cup is not magnetic.","pic":"🥤","sk":"plast"},{"en":"wood","ex":"Wood does not stick to a magnet.","pic":"🪵","sk":"drevo"},{"en":"stick","ex":"Nails stick to a strong magnet.","pic":"🧲","sk":"prilepiť sa, držať"}],"m":9,"month":"September"},{"draw":{"labels":["magnet","paper clip","ruler","distance","magnetic field"],"task":"Draw a magnet, a paper clip and a ruler showing the distance between them.","taskSk":"Nakresli magnet, sponku a pravítko, ktoré ukazuje vzdialenosť medzi nimi."},"gaps":[{"answer":"field","options":["field","water","box"],"text":"The invisible space around a magnet is the magnetic ___."},{"answer":"attract","options":["attract","eat","paint"],"text":"A magnet can ___ a paper clip without touching it."},{"answer":"ruler","options":["ruler","spoon","shoe"],"text":"We measure the distance with a ___."},{"answer":"plastic","options":["plastic","iron","steel"],"text":"A magnet does not pull ___ or wood."},{"answer":"strong","options":["strong","weak","cold"],"text":"A ___ magnet pulls the clip from farther away."}],"icon":"🧲","id":"science-03","intro":"You will learn that a magnet pulls things from a distance and how to compare two magnets.","reading":{"paragraphs":["A [magnet] does not need to touch things. It can [attract] a [paper clip] from a small [distance]. The invisible space around a magnet is called the [magnetic field].","You cannot see the [magnetic field]. But you can see what it does. The clip moves and jumps. The field is strongest close to the [magnet] and weaker far away.","A magnet pulls [iron] and steel. It does not pull [plastic], [wood], paper or glass. Try it at home with safe objects.","Here is an [experiment]. Put a [paper clip] on the table. Move the magnet slowly closer. Stop when the clip jumps. Measure the [distance] with a [ruler].","Now test a second magnet the same way. A [strong] magnet pulls the clip from farther away. A [weak] magnet must be very close."],"title":"An Invisible Helper","titleSk":"Neviditeľný pomocník"},"robot":{"prompts":[{"answer":"1. Put a paper clip on the table. 2. Move one magnet slowly closer and stop when the clip jumps. 3. Measure that distance with a ruler. Repeat with the other magnet.","bad":"magnets?","goal":"How to compare two magnets","goalSk":"Ako porovnať dva magnety","good":"How can I compare two magnets at home? Explain in 3 easy steps for a 10-year-old.","tip":"It says who you are and asks for steps."},{"answer":"Magnets attract iron and steel: a nail, a key, a paper clip. They do not attract plastic, wood or paper.","bad":"tell me about stuff","goal":"Which materials a magnet attracts","goalSk":"Ktoré materiály magnet priťahuje","good":"Which materials does a magnet attract? Give me three examples and three non-examples.","tip":"Clear question with examples gives a useful answer."}],"statements":[{"explain":"A magnet works at a distance, because it has a magnetic field.","ok":false,"text":"A magnet must touch a paper clip to move it."},{"explain":"The field is invisible; we watch the clip jump to see it.","ok":true,"text":"You cannot see a magnetic field, but you can see how it moves objects."},{"explain":"Magnets attract iron and steel, not plastic or wood.","ok":false,"text":"Magnets attract plastic and wood very well."},{"explain":"The pull gets weaker as the distance grows.","ok":true,"text":"The magnetic field is strongest close to the magnet."},{"explain":"Strong magnets have a bigger field than weak magnets.","ok":false,"text":"All magnets have a magnetic field of exactly the same size."}]},"sort":{"groups":[{"en":"A magnet attracts it","id":"yes","pic":"🧲"},{"en":"A magnet does not attract it","id":"no","pic":"🚫"}],"items":[{"en":"paper clip","group":"yes","pic":"📎"},{"en":"iron nail","group":"yes","pic":"🔩"},{"en":"steel key","group":"yes","pic":"🔑"},{"en":"plastic cup","group":"no","pic":"🥤"},{"en":"wood stick","group":"no","pic":"🪵"},{"en":"paper card","group":"no","pic":"📄"}]},"subject":"science","test":[{"answer":"the invisible space around a magnet where it pulls","options":["the invisible space around a magnet where it pulls","a metal box","a kind of ruler"],"q":"What is a magnetic field?","qSk":"Čo je magnetické pole?"},{"answer":"priťahovať","options":["priťahovať","kresliť","merať"],"q":"What does 'attract' mean in Slovak?","qSk":"Čo znamená 'attract' po slovensky?"},{"answer":"paper clip","options":["paper clip","plastic cup","wood stick"],"q":"Which object does a magnet attract?","qSk":"Ktorý predmet magnet priťahuje?"},{"answer":"false","options":["true","false"],"q":"A magnet must touch an object to pull it.","qSk":"Magnet sa musí predmetu dotknúť, aby ho pritiahol."},{"answer":"the distance when the clip jumps","options":["the distance when the clip jumps","the weight of the magnet","the colour of the clip"],"q":"In the experiment, what do we measure with a ruler?","qSk":"Čo meriame v pokuse pravítkom?"},{"answer":"true","options":["true","false"],"q":"A strong magnet pulls the clip from farther away.","qSk":"Silný magnet pritiahne sponku z väčšej diaľky."},{"answer":"close to the magnet","options":["close to the magnet","far from the magnet","in the ruler"],"q":"Where is the magnetic field strongest?","qSk":"Kde je magnetické pole najsilnejšie?"},{"answer":"slabý","options":["slabý","ťažký","teplý"],"q":"What does 'weak' mean in Slovak?","qSk":"Čo znamená 'weak' po slovensky?"}],"title":"The Magnetic Field","titleSk":"Magnetické pole","unit":"1. We are looking for inanimate nature and natural phenomena","words":[{"en":"magnet","ex":"A magnet can pull a small nail.","pic":"🧲","sk":"magnet"},{"en":"magnetic field","ex":"The magnetic field is around every magnet.","pic":"✨","sk":"magnetické pole"},{"en":"attract","ex":"Magnets attract iron and steel objects.","pic":"🔗","sk":"priťahovať"},{"en":"iron","ex":"Iron sticks to a strong magnet.","pic":"⛓️","sk":"železo"},{"en":"paper clip","ex":"The paper clip jumps to the magnet.","pic":"📎","sk":"kancelárska sponka"},{"en":"distance","ex":"Measure the distance with a ruler.","pic":"📏","sk":"vzdialenosť"},{"en":"ruler","ex":"Use a ruler to measure centimetres.","pic":"📐","sk":"pravítko"},{"en":"strong","ex":"A strong magnet works from far away.","pic":"💪","sk":"silný"},{"en":"weak","ex":"A weak magnet works only very close.","pic":"🪶","sk":"slabý"},{"en":"experiment","ex":"We do an experiment with two magnets.","pic":"🔬","sk":"pokus, experiment"},{"en":"plastic","ex":"Plastic does not stick to a magnet.","pic":"🥤","sk":"plast"},{"en":"wood","ex":"Wood is not magnetic at all.","pic":"🪵","sk":"drevo"}],"m":9,"month":"September"},{"draw":{"labels":["hiker","compass","forest","north","south"],"task":"Draw a hiker in a forest with a compass. Label the four directions.","taskSk":"Nakresli turistu v lese s kompasom. Popíš štyri svetové strany."},"gaps":[{"answer":"north","options":["north","south","east"],"text":"The coloured end of the compass needle points to the ___."},{"answer":"magnet","options":["magnet","stone","battery"],"text":"The needle inside a compass is a small ___."},{"answer":"east","options":["east","west","north"],"text":"The sun rises in the ___."},{"answer":"map","options":["map","clock","spoon"],"text":"A hiker uses a compass and a ___ in the forest."},{"answer":"direction","options":["direction","colour","time"],"text":"A compass shows us the right ___."}],"icon":"🧭","id":"science-04","intro":"You will learn what a compass is and how it shows direction.","reading":{"paragraphs":["A [compass] is a small tool. Inside it there is a thin [needle]. The [needle] is a small [magnet]. It can turn freely and it always stops in the same [direction].","The [Earth] works like a big [magnet]. That is why the coloured end of the [needle] points to the [north]. Opposite to [north] is [south]. On the left is [west] and on the right is [east].","A [hiker] puts the [compass] flat on the hand. He waits until the [needle] stops. Then he knows the [direction] and he can read his [map].","People use a [compass] in a big [forest], in the mountains or on a boat. A [compass] needs no batteries. But keep it away from a strong [magnet] or iron, because they move the [needle]."],"title":"The Little Helper in Your Hand","titleSk":"Malý pomocník v ruke","titleSkDup":null},"robot":{"prompts":[{"answer":"1. Hold the compass flat on your hand. 2. Wait until the needle stops moving. 3. Turn until the coloured end shows north. Now you know east, south and west.","bad":"compass?","goal":"How to use a compass step by step","goalSk":"Ako používať kompas krok za krokom","good":"Explain in 3 simple steps how a 10-year-old uses a compass in a forest.","tip":"It says who, how many steps and where."},{"answer":"Earth is like a big magnet. The needle is a small magnet, so it turns to Earth's magnetic north. Example: in a forest the needle always shows the same direction.","bad":"needle north why","goal":"Why the needle turns to the north","goalSk":"Prečo sa strelka otáča na sever","good":"Why does a compass needle point north? Explain simply for a 10-year-old and give one example.","tip":"Clear question plus age and example gives a simple answer."}],"promptsCount":2,"statements":[{"explain":"Yes, the needle is a light magnet that can turn freely.","ok":true,"text":"The needle of a compass is a small magnet."},{"explain":"The coloured end of the needle points to the north.","ok":false,"text":"The coloured end of the needle always points to the south."},{"explain":"A compass works with magnetism, so it needs no batteries.","ok":true,"text":"A compass does not need batteries."},{"explain":"Iron and magnets move the needle, so a compass shows wrong directions near them.","ok":false,"text":"You should hold a compass next to iron or a strong magnet to make it more exact."},{"explain":"Yes, these are the four main directions on a compass.","ok":true,"text":"The four main directions are north, south, east and west."}]},"sort":{"groups":[{"en":"Directions","id":"dir","pic":"🧭"},{"en":"Things we use","id":"thing","pic":"🎒"}],"items":[{"en":"north","group":"dir","pic":"⬆️"},{"en":"south","group":"dir","pic":"⬇️"},{"en":"east","group":"dir","pic":"➡️"},{"en":"west","group":"dir","pic":"⬅️"},{"en":"compass","group":"thing","pic":"🧭"},{"en":"map","group":"thing","pic":"🗺️"},{"en":"magnet","group":"thing","pic":"🧲"},{"en":"needle","group":"thing","pic":"📍"}]},"subject":"science","test":[{"answer":"A tool that shows direction","options":["A tool that shows direction","A tool that shows time","A small map"],"q":"What is a compass?","qSk":"Čo je kompas?"},{"answer":"magnet","options":["magnet","stone","light"],"q":"The compass needle is a small ___.","qSk":"Strelka kompasu je malý ___."},{"answer":"north","options":["north","south","west"],"q":"Where does the coloured end of the needle point?","qSk":"Kam ukazuje farebný koniec strelky?"},{"answer":"turista","options":["turista","učiteľ","vodič"],"q":"What does 'hiker' mean?","qSk":"Čo znamená slovo 'hiker'?"},{"answer":"false","options":["true","false"],"q":"A compass needs batteries.","qSk":"Kompas potrebuje batérie."},{"answer":"true","options":["true","false"],"q":"Earth works like a big magnet.","qSk":"Zem sa správa ako veľký magnet."},{"answer":"iron and strong magnets","options":["iron and strong magnets","paper","water in a bottle"],"q":"What can move the compass needle the wrong way?","qSk":"Čo môže pohnúť strelkou nesprávne?"},{"answer":"false","options":["true","false"],"q":"The sun rises in the west.","qSk":"Slnko vychádza na západe."}],"title":"Using a Compass","titleSk":"Ako používame kompas","unit":"1. We are looking for inanimate nature and natural phenomena","words":[{"en":"compass","ex":"A compass helps you find the way.","pic":"🧭","sk":"kompas"},{"en":"needle","ex":"The needle in a compass is a small magnet.","pic":"📍","sk":"ihla, strelka"},{"en":"north","ex":"The red needle points to the north.","pic":"⬆️","sk":"sever"},{"en":"south","ex":"South is opposite to north.","pic":"⬇️","sk":"juh"},{"en":"east","ex":"The sun rises in the east.","pic":"➡️","sk":"východ"},{"en":"west","ex":"The sun sets in the west.","pic":"⬅️","sk":"západ"},{"en":"direction","ex":"A compass shows the right direction.","pic":"↗️","sk":"smer"},{"en":"magnet","ex":"A magnet can move the compass needle.","pic":"🧲","sk":"magnet"},{"en":"map","ex":"We use a map with a compass.","pic":"🗺️","sk":"mapa"},{"en":"forest","ex":"People use a compass in the forest.","pic":"🌲","sk":"les"},{"en":"hiker","ex":"The hiker walks to the north.","pic":"🥾","sk":"turista"},{"en":"Earth","ex":"Earth works like a big magnet.","pic":"🌍","sk":"Zem"}],"m":9,"month":"September"},{"draw":{"labels":["lever","fulcrum","load","force"],"task":"Draw a lever lifting a heavy box.","taskSk":"Nakresli páku, ktorá dvíha ťažkú krabicu."},"gaps":[{"answer":"lever","options":["lever","gear","screw"],"text":"A ___ turns on a fulcrum."},{"answer":"teeth","options":["teeth","rope","legs"],"text":"A gear is a wheel with ___."},{"answer":"rope","options":["rope","slope","screw"],"text":"A pulley has a wheel and a ___."},{"answer":"slope","options":["slope","wall","tree"],"text":"It is easier to push a box up a ___."},{"answer":"less","options":["less","more","no"],"text":"With a machine we need ___ force."}],"icon":"svg:pulley","id":"science-16","intro":"Learn how machines help us lift and move heavy things.","reading":{"paragraphs":["Simple machines help us do work with less [force]. We use them every day!","A [lever] is a long bar. It turns on a [fulcrum]. A longer lever needs less force to lift a heavy [load]. A seesaw and [scissors] are levers.","An [inclined plane] is a slope. It is easier to push a box up a slope than to lift it. A [screw] and an [axe] are inclined planes too.","A [pulley] is a wheel with a rope. We pull the rope down and the load goes up. A [crane] uses pulleys.","A [gear] is a wheel with teeth. Gears turn other gears. You can find gears in a [bicycle] and in a clock."],"title":"Machines make work easy","titleSk":"Stroje nám uľahčujú prácu"},"robot":{"prompts":[{"answer":"A pulley is a wheel with a rope. You pull the rope down and the load goes up. Pulling down is easier than lifting up!","bad":"pulley","goal":"You want to know how a pulley works.","goalSk":"Chceš vedieť, ako funguje kladka.","good":"How does a pulley help us lift heavy things? Explain it for a 10-year-old.","tip":"Say what you want to know and for whom."},{"answer":"1. Scissors. 2. A bottle opener. 3. A door handle. They all turn on a fixed point.","bad":"levers home?","goal":"You want examples of levers at home.","goalSk":"Chceš príklady pák doma.","good":"Give me 3 examples of levers I can find at home.","tip":"Ask for a number of examples. It is clearer."}],"statements":[{"explain":"Yes! The fulcrum is the fixed point of a lever.","ok":true,"text":"A lever turns on a point called the fulcrum."},{"explain":"A LONGER lever needs less force.","ok":false,"text":"A short lever makes lifting easier than a long lever."},{"explain":"Right! Cranes have ropes and pulleys.","ok":true,"text":"A crane uses pulleys to lift heavy things."},{"explain":"Gears have teeth on the edge.","ok":false,"text":"Gears are smooth wheels with no teeth."},{"explain":"An axe is a kind of inclined plane (a wedge).","ok":false,"text":"An axe is a kind of pulley."}]},"sort":{"groups":[{"en":"lever","id":"lever","pic":"svg:lever"},{"en":"inclined plane","id":"ramp","pic":"svg:ramp"},{"en":"pulley","id":"pulley","pic":"svg:pulley"},{"en":"gear","id":"gear","pic":"svg:gear"}],"items":[{"en":"scissors","group":"lever","pic":"✂️"},{"en":"oar","group":"lever","pic":"🚣"},{"en":"axe","group":"ramp","pic":"🪓"},{"en":"screw","group":"ramp","pic":"🔩"},{"en":"crane","group":"pulley","pic":"🏗️"},{"en":"flagpole","group":"pulley","pic":"🚩"},{"en":"bicycle","group":"gear","pic":"🚲"},{"en":"clock","group":"gear","pic":"🕰️"}]},"subject":"science","test":[{"answer":"a long lever","options":["a long lever","a short lever"],"q":"Which lever needs less force?","qSk":"Ktorá páka potrebuje menšiu silu?"},{"answer":"levers","options":["levers","pulleys","gears"],"q":"Scissors are two ___.","qSk":"Nožnice sú dve ..."},{"answer":"true","options":["true","false"],"q":"A screw is an inclined plane.","qSk":"Skrutka je naklonená rovina."},{"answer":"false","options":["true","false"],"q":"A crane uses gears to lift things up.","qSk":"Žeriav dvíha veci pomocou ozubených kolies."},{"answer":"work","options":["work","sleep","music"],"q":"Simple machines help us with ___.","qSk":"Jednoduché stroje nám pomáhajú pri ..."},{"answer":"teeth","options":["teeth","a rope","a slope"],"q":"What does a gear have on the edge?","qSk":"Čo má ozubené koleso na okraji?"},{"answer":"rope","options":["rope","screw","chain"],"q":"A pulley is a wheel with a ___.","qSk":"Kladka je koleso s ..."},{"answer":"in a bicycle","options":["in a bicycle","in an axe","in a ramp"],"q":"Where can you find gears?","qSk":"Kde nájdeš ozubené kolesá?"}],"title":"Simple machines","titleSk":"Jednoduché stroje","unit":"1. We are looking for inanimate nature and natural phenomena","words":[{"en":"lever","ex":"A lever helps us lift heavy things.","pic":"svg:lever","sk":"páka"},{"en":"fulcrum","ex":"The lever turns on the fulcrum.","pic":"svg:fulcrum","sk":"opora (pevný bod)"},{"en":"inclined plane","ex":"We push a box up an inclined plane.","pic":"svg:ramp","sk":"naklonená rovina"},{"en":"pulley","ex":"We pull the rope down and the load goes up.","pic":"svg:pulley","sk":"kladka"},{"en":"gear","ex":"Gears have teeth on the edge.","pic":"svg:gear","sk":"ozubené koleso"},{"en":"load","ex":"The load is the heavy thing we move.","pic":"📦","sk":"bremeno, náklad"},{"en":"force","ex":"With a machine we need less force.","pic":"💪","sk":"sila"},{"en":"scissors","ex":"Scissors are two levers.","pic":"✂️","sk":"nožnice"},{"en":"screw","ex":"A screw is an inclined plane around a stick.","pic":"🔩","sk":"skrutka"},{"en":"axe","ex":"An axe splits wood.","pic":"🪓","sk":"sekera"},{"en":"crane","ex":"A crane uses pulleys.","pic":"🏗️","sk":"žeriav"},{"en":"bicycle","ex":"A bicycle has gears and a chain.","pic":"🚲","sk":"bicykel"}],"m":11,"month":"November"},{"draw":{"labels":["dot","star","row of dots","size"],"task":"Draw a night sky with dots. Make big and small stars.","taskSk":"Nakresli nočnú oblohu z bodiek. Urob veľké a malé hviezdy."},"gaps":[{"answer":"dot","options":["dot","grid","sponge"],"text":"A ___ is the smallest mark in a picture."},{"answer":"press","options":["press","sing","read"],"text":"I ___ my finger on the paper to make a dot."},{"answer":"pointillism","options":["pointillism","texture","grid"],"text":"Painting with many small colour dots is called ___."},{"answer":"row","options":["row","star","brush"],"text":"A ___ of dots looks like a line."},{"answer":"sponge","options":["sponge","grid","ruler"],"text":"A big wet ___ makes a soft round dot."}],"icon":"⚫","id":"art-01","intro":"You learn how to make dots with many tools and how to build pictures and stories from dots.","reading":{"paragraphs":["A [dot] is the smallest mark in art. You make a [dot] when you [press] a [pencil], a [brush] or your [finger] on paper. Dots are easy and fun.","Dots are not all the same. They have a different [size] and colour. A [sponge] makes a big soft dot. A sharp [pencil] makes a tiny dot.","Many dots close together look dark. Far away dots look light. This is called [texture]. A [row of dots] looks like a line, so you can draw with dots only.","Some painters paint whole pictures with small colour dots. This is [pointillism]. Printers also use a [grid] of tiny dots. Look at a comic picture with a magnifier.","Dots can tell a story. A white dot can be a [star] in space. Small dark dots can be a meadow grasshopper jumping in the grass."],"title":"The Magic of Dots","titleSk":"Kúzlo bodiek"},"robot":{"prompts":[{"answer":"One: press a finger in paint for a big dot. Two: tap a thin pencil for a small dot. Three: dab a wet sponge for a soft, rough dot.","bad":"dots?","goal":"How to make different dots","goalSk":"Ako urobiť rôzne bodky","good":"Give me 3 easy ways to make big and small dots on paper, for a 10-year-old.","tip":"Clear questions say how many ideas and for whom."},{"answer":"One: painters use many tiny dots. Two: they put colours side by side. Three: your eyes mix them. Example: a park full of people made only of dots.","bad":"art history","goal":"What pointillism is","goalSk":"Čo je pointilizmus","good":"Explain pointillism in three simple steps and give one example of a picture.","tip":"Ask for steps and an example to understand better."}],"statements":[{"explain":"Many tools can touch the paper and leave a dot.","ok":true,"text":"You can make dots with a pencil, a brush, a sponge or your finger."},{"explain":"Dots can be big or small; different sizes make a picture interesting.","ok":false,"text":"All dots must be the same size, or the picture is wrong."},{"explain":"Dense dots make a dark texture, loose dots look light.","ok":true,"text":"Many dots close together look darker than dots far apart."},{"explain":"Pointillism means painting with many small dots of colour.","ok":false,"text":"Pointillism means drawing only long straight lines."},{"explain":"Dots in a row join in our eyes and make a line.","ok":true,"text":"A row of dots can look like a line from far away."}]},"sort":{"groups":[{"en":"Tools for dots","id":"tools","pic":"🧰"},{"en":"Dot words","id":"ideas","pic":"💡"}],"items":[{"en":"brush","group":"tools","pic":"🖌️"},{"en":"pencil","group":"tools","pic":"✏️"},{"en":"finger","group":"tools","pic":"👆"},{"en":"sponge","group":"tools","pic":"🧽"},{"en":"pointillism","group":"ideas","pic":"🎨"},{"en":"texture","group":"ideas","pic":"🧱"},{"en":"grid","group":"ideas","pic":"🔳"},{"en":"row of dots","group":"ideas","pic":"➡️"}]},"subject":"art","test":[{"answer":"the smallest mark in a picture","options":["the smallest mark in a picture","a long line","a colour"],"q":"What is a dot?","qSk":"Čo je bodka?"},{"answer":"pritlačiť","options":["pritlačiť","kresliť čiaru","strihať"],"q":"What does 'press' mean?","qSk":"Čo znamená 'press'?"},{"answer":"a sponge","options":["a sponge","a sharp pencil","a ruler"],"q":"Which tool makes a big soft dot?","qSk":"Ktorý nástroj urobí veľkú mäkkú bodku?"},{"answer":"true","options":["true","false"],"q":"Pointillism is painting with many small dots.","qSk":"Pointilizmus je maľovanie mnohými malými bodkami."},{"answer":"dark","options":["dark","white","empty"],"q":"Dots very close together look ___.","qSk":"Bodky veľmi blízko pri sebe vyzerajú ___."},{"answer":"štruktúra povrchu","options":["štruktúra povrchu","hviezda","mriežka"],"q":"What does 'texture' mean in Slovak?","qSk":"Čo znamená 'texture' po slovensky?"},{"answer":"true","options":["true","false"],"q":"A row of dots can look like a line.","qSk":"Rad bodiek môže vyzerať ako čiara."},{"answer":"false","options":["true","false"],"q":"All dots in a picture must have the same size.","qSk":"Všetky bodky v obrázku musia mať rovnakú veľkosť."}],"title":"Point in Art","titleSk":"Bod vo výtvarnej výchove","unit":"Artistic means of expression","words":[{"en":"dot","ex":"I make one small dot on paper.","pic":"⚫","sk":"bodka, bod"},{"en":"brush","ex":"The brush makes a soft wet dot.","pic":"🖌️","sk":"štetec"},{"en":"pencil","ex":"My pencil makes a tiny grey dot.","pic":"✏️","sk":"ceruzka"},{"en":"finger","ex":"I paint a dot with my finger.","pic":"👆","sk":"prst"},{"en":"sponge","ex":"A sponge makes a big rough dot.","pic":"🧽","sk":"špongia"},{"en":"press","ex":"Press the brush on the paper.","pic":"👇","sk":"pritlačiť"},{"en":"size","ex":"Dots have a different size.","pic":"📏","sk":"veľkosť"},{"en":"pointillism","ex":"Pointillism uses many small colour dots.","pic":"🎨","sk":"pointilizmus (maľba bodkami)"},{"en":"row of dots","ex":"A row of dots looks like a line.","pic":"➡️","sk":"rad bodiek"},{"en":"texture","ex":"Many dots make a dark texture.","pic":"🧱","sk":"štruktúra povrchu"},{"en":"grid","ex":"Printers use a grid of small dots.","pic":"🔳","sk":"mriežka"},{"en":"star","ex":"Each star is a bright white dot.","pic":"⭐","sk":"hviezda"}],"m":9,"month":"September"},{"draw":{"labels":["line","hatching","shadow","light"],"task":"Draw an apple on a table. Make one side dark with lines.","taskSk":"Nakresli jablko na stole. Jednu stranu stmav čiarami."},"gaps":[{"answer":"hatching","options":["hatching","light","ink"],"text":"Many short lines next to each other are called ___."},{"answer":"cross-hatching","options":["cross-hatching","texture","pencil"],"text":"Lines that cross in two directions are called ___."},{"answer":"shading","options":["shading","line","ink"],"text":"Smooth and soft dark parts with no lines are called ___."},{"answer":"pressure","options":["pressure","light","shadow"],"text":"Strong ___ on the pencil makes a dark line."},{"answer":"still life","options":["still life","landscape","shadow"],"text":"A drawing of fruit on a table is a ___."}],"icon":"✏️","id":"art-04","intro":"You will learn how to draw shadows with lines using hatching and shading.","reading":{"paragraphs":["First you draw a [still life] or a [landscape] with a simple [line]. The line shows the shape. Then you make some parts dark and some parts bright.","[hatching] means many short lines next to each other. Close lines look dark. Lines far apart look bright. This is how you show a [shadow].","[cross-hatching] means lines in two directions. They cross like a net. It looks darker than simple hatching.","[shading] is different. You use a soft [pencil] and rub it. It is smooth, with no lines. With [ink] you can only use lines, not smooth shading.","Change your [pressure]. Strong pressure is dark, soft pressure is bright. The [light] side stays white. Lines can also show [texture], like fur or wood."],"title":"Drawing with Lines","titleSk":"Kreslenie čiarami"},"robot":{"prompts":[{"answer":"Step 1: Draw a circle. Step 2: Decide where the light comes from and leave that part white. Step 3: Add hatching on the other side, dark at the edge, and draw a shadow on the table.","bad":"ball shading","goal":"Learn how to shade a ball","goalSk":"Naučiť sa tieňovať guľu","good":"How do I shade a drawing of a ball with a pencil? Explain in 3 steps for a 10-year-old.","tip":"It says what, how many steps, and for whom."},{"answer":"Hatching uses many separate lines, like on a pen drawing of a tree. Smooth shading has no lines; you rub a soft pencil, like on a round apple.","bad":"lines?","goal":"Find out the difference between hatching and shading","goalSk":"Zistiť rozdiel medzi šrafovaním a tieňovaním","good":"What is the difference between hatching and smooth shading? Give one simple example for each.","tip":"It names both words and asks for examples."}],"statements":[{"explain":"Yes, close lines look dark and far lines look bright.","ok":true,"text":"Hatching means drawing many lines close together to make a part look darker."},{"explain":"Ink cannot be rubbed smooth; with ink you make lines. Soft pencil can be rubbed.","ok":false,"text":"With ink you can rub the drawing to make smooth shading."},{"explain":"Cross-hatching has more lines, so it looks darker.","ok":false,"text":"Cross-hatching is lighter than simple hatching."},{"explain":"Light and shadow are on opposite sides of an object.","ok":true,"text":"The side of an object near the light stays bright, and the shadow is on the other side."},{"explain":"You change the pressure to get dark and bright parts.","ok":false,"text":"You should always press the pencil with the same strong pressure."}]},"sort":{"groups":[{"en":"Tools","id":"tools","pic":"🧰"},{"en":"Techniques","id":"tech","pic":"🎨"}],"items":[{"en":"pencil","group":"tools","pic":"✏️"},{"en":"ink","group":"tools","pic":"🖋️"},{"en":"pen","group":"tools","pic":"🖊️"},{"en":"hatching","group":"tech","pic":"#️⃣"},{"en":"cross-hatching","group":"tech","pic":"🔲"},{"en":"shading","group":"tech","pic":"🌗"}]},"subject":"art","test":[{"answer":"tieň","options":["tieň","svetlo","čiara"],"q":"What does 'shadow' mean in Slovak?","qSk":"Čo znamená 'shadow' po slovensky?"},{"answer":"many short lines","options":["many short lines","one big dot","a colour"],"q":"What is hatching?","qSk":"Čo je šrafovanie?"},{"answer":"cross-hatching","options":["cross-hatching","one thin line"],"q":"Which looks darker?","qSk":"Čo vyzerá tmavšie?"},{"answer":"true","options":["true","false"],"q":"You can rub soft pencil to make smooth shading.","qSk":"Mäkkú ceruzku môžeš rozotrieť na hladké tieňovanie."},{"answer":"false","options":["true","false"],"q":"Lines far apart look dark.","qSk":"Čiary ďaleko od seba vyzerajú tmavo."},{"answer":"the line shape","options":["the line shape","the shadow","the texture"],"q":"What do you draw first?","qSk":"Čo kreslíš najskôr?"},{"answer":"landscape","options":["landscape","still life","portrait"],"q":"A drawing of hills and trees is a...","qSk":"Kresba kopcov a stromov je..."},{"answer":"false","options":["true","false"],"q":"Strong pressure on the pencil makes a bright line.","qSk":"Silný tlak na ceruzku robí svetlú čiaru."}],"title":"Hatching and Shadow","titleSk":"Šrafovanie a tieň","unit":"Artistic means of expression","words":[{"en":"line","ex":"I draw a long line with a pencil.","pic":"➖","sk":"čiara"},{"en":"hatching","ex":"Hatching uses many short lines.","pic":"🖊️","sk":"šrafovanie"},{"en":"cross-hatching","ex":"Cross-hatching makes the apple look darker.","pic":"#️⃣","sk":"krížové šrafovanie"},{"en":"shading","ex":"Shading is soft and smooth.","pic":"🌗","sk":"tieňovanie"},{"en":"shadow","ex":"The cup has a shadow on the table.","pic":"👤","sk":"tieň"},{"en":"light","ex":"The light comes from the window.","pic":"💡","sk":"svetlo"},{"en":"pencil","ex":"A soft pencil draws dark lines.","pic":"✏️","sk":"ceruzka"},{"en":"ink","ex":"I draw thin lines with black ink.","pic":"🖋️","sk":"tuš"},{"en":"pressure","ex":"Strong pressure makes a dark line.","pic":"💪","sk":"tlak"},{"en":"texture","ex":"Lines can show the texture of wood.","pic":"🧱","sk":"textúra"},{"en":"still life","ex":"A still life shows fruit on a table.","pic":"🍎","sk":"zátišie"},{"en":"landscape","ex":"My landscape has hills and trees.","pic":"🏞️","sk":"krajinka"}],"m":9,"month":"September"},{"draw":{"labels":["party","guest","costume","birthday","gesture"],"task":"Draw a birthday party with two guests in costumes. Label your picture.","taskSk":"Nakresli oslavu narodenín s dvoma hosťami v kostýmoch. Popíš obrázok."},"gaps":[{"answer":"guest","options":["guest","voice","job"],"text":"Every ___ comes to my party with a present."},{"answer":"pretend","options":["pretend","guess","clap"],"text":"In a role play I ___ to be a pilot."},{"answer":"costume","options":["costume","greeting","party"],"text":"A hat and a coat make a simple ___."},{"answer":"greeting","options":["greeting","gesture","job"],"text":"The nurse says a kind ___ to the birthday girl."},{"answer":"guess","options":["guess","pretend","sing"],"text":"I listen and then I ___ your job."}],"icon":"🎭","id":"mad-01","intro":"You will learn party and drama words and act out a birthday guest.","reading":{"paragraphs":["It is my [birthday]. I have a [party] at school. Every [guest] comes to the door. But nobody says a name. It is a fun [role play] game.","Each [guest] must [pretend] to be somebody. One friend is a nurse. She checks my pulse. Another friend is a farmer with a potato in his bag.","Then each [guest] says a [greeting]. The nurse says: \"Happy [birthday]! Stay healthy this year!\" I listen and I [guess] her [job].","Good actors use a [costume], a funny [voice] and a clear [gesture]. A small hat or a spoon is enough. Big words are not always needed.","In the next game, every [guest] is a [famous person]: a singer, a football player or an astronaut. I still [guess]. Then we clap and swap roles."],"title":"Who Is at My Party?","titleSk":"Kto je na mojej oslave?"},"robot":{"prompts":[{"answer":"1. Doctor – listen to a heart with your hand. 2. Chef – stir a big pot. 3. Pilot – hold the wheel and fly. Say a greeting that fits your job.","bad":"role play?","goal":"Find easy ideas for a role play character","goalSk":"Nájsť ľahké nápady na postavu do hrania rolí","good":"Give me 3 easy role play jobs for a 10-year-old party, with one gesture each.","tip":"It says the age, the number and what you need."},{"answer":"Here are two: \"Happy birthday! I wish you a fun year!\" and \"Happy birthday! Stay healthy and strong!\" Example: a nurse guest can say the second one.","bad":"greetings","goal":"Learn how to say a birthday greeting in English","goalSk":"Naučiť sa povedať anglické blahoželanie k narodeninám","good":"Show me 2 short birthday greetings in simple English for a 10-year-old, with an example.","tip":"Clear questions say how many, how simple and give an example."}],"statements":[{"explain":"Yes, the birthday person listens and guesses the guest's job.","ok":true,"text":"In this game the birthday person guesses the job of each guest."},{"explain":"Actors use voice, words and gestures to show the character.","ok":false,"text":"In a role play you must stay silent and never use your voice."},{"explain":"A hat, a spoon or a scarf is enough for a costume.","ok":false,"text":"You need an expensive costume from a shop for role play."},{"explain":"Yes, the game also works with famous people.","ok":true,"text":"Guests can also pretend to be famous people, like a singer."},{"explain":"A good greeting gives a small clue about the job.","ok":false,"text":"A greeting at a birthday party must never say anything about the guest's job."}]},"sort":{"groups":[{"en":"Jobs at the party","id":"jobs","pic":"👷"},{"en":"Drama tools","id":"drama","pic":"🎭"}],"items":[{"en":"nurse","group":"jobs","pic":"👩‍⚕️"},{"en":"farmer","group":"jobs","pic":"👨‍🌾"},{"en":"singer","group":"jobs","pic":"🎤"},{"en":"pilot","group":"jobs","pic":"✈️"},{"en":"costume","group":"drama","pic":"👗"},{"en":"voice","group":"drama","pic":"🗣️"},{"en":"gesture","group":"drama","pic":"🙌"},{"en":"greeting","group":"drama","pic":"👋"}]},"subject":"mad","test":[{"answer":"hosť","options":["hosť","darček","torta"],"q":"What does 'guest' mean?","qSk":"Čo znamená slovo 'guest'?"},{"answer":"predstierať","options":["predstierať","hádať","spievať"],"q":"What does 'pretend' mean?","qSk":"Čo znamená slovo 'pretend'?"},{"answer":"the birthday person","options":["the birthday person","the teacher","the nurse"],"q":"Who guesses the jobs in the game?","qSk":"Kto v hre háda povolania?"},{"answer":"my pulse","options":["my pulse","my bag","my hat"],"q":"What does the nurse in the text check?","qSk":"Čo sestrička v texte kontroluje?"},{"answer":"a potato","options":["a potato","a violin","a ball"],"q":"What does the farmer have in his bag?","qSk":"Čo má farmár v taške?"},{"answer":"true","options":["true","false"],"q":"A costume can be a simple hat or a spoon.","qSk":"Kostým môže byť aj jednoduchý klobúk alebo lyžica."},{"answer":"true","options":["true","false"],"q":"Good actors use voice and gestures.","qSk":"Dobrí herci používajú hlas a gestá."},{"answer":"false","options":["true","false"],"q":"In the second game the guests are animals.","qSk":"V druhej hre sú hostia zvieratá."}],"title":"Party People Role Play","titleSk":"Ľudia na oslave – hranie rolí","unit":"September","words":[{"en":"party","ex":"We have a party today.","pic":"🎉","sk":"oslava, párty"},{"en":"guest","ex":"Every guest brings a small present.","pic":"🧑","sk":"hosť"},{"en":"birthday","ex":"Today is my birthday.","pic":"🎂","sk":"narodeniny"},{"en":"role play","ex":"We do a role play in class.","pic":"🎭","sk":"hranie rolí"},{"en":"pretend","ex":"I pretend to be a doctor.","pic":"🤹","sk":"predstierať, hrať sa na"},{"en":"job","ex":"Guess my job, please.","pic":"👷","sk":"povolanie, práca"},{"en":"greeting","ex":"Each guest says a funny greeting.","pic":"👋","sk":"pozdrav, blahoželanie"},{"en":"guess","ex":"Can you guess my character?","pic":"🤔","sk":"hádať"},{"en":"costume","ex":"My costume is a big hat.","pic":"👗","sk":"kostým"},{"en":"voice","ex":"Use a deep voice on stage.","pic":"🗣️","sk":"hlas"},{"en":"gesture","ex":"A gesture shows your job without words.","pic":"🙌","sk":"gesto"},{"en":"famous person","ex":"I act as a famous person.","pic":"⭐","sk":"slávna osoba"}],"m":9,"month":"September"},{"draw":{"labels":["trolley","bread","potato","apple"],"task":"Draw a trolley with bread, a potato and an apple inside.","taskSk":"Nakresli nákupný vozík s chlebom, zemiakom a jablkom."},"gaps":[{"answer":"cashier","options":["cashier","apple","trolley"],"text":"The ___ takes the money and gives you a receipt."},{"answer":"shopping list","options":["shopping list","price","receipt"],"text":"I write bread and milk on my ___."},{"answer":"trolley","options":["trolley","bread","customer"],"text":"Push the ___ around the shop."},{"answer":"price","options":["price","potato","cashier"],"text":"The ___ of this bread is one euro."},{"answer":"role play","options":["role play","receipt","supermarket"],"text":"In a ___ we act like shop people."}],"icon":"🛒","id":"mad-02","intro":"You will learn shop words and act out a shopping role play.","reading":{"paragraphs":["Today we play a little drama. Our classroom is a [supermarket]. One pupil is the [cashier]. The other pupils are the [customer] friends with bags.","First, you write a [shopping list]. My list says [bread], one [potato] and one red [apple]. A short list helps you remember everything.","Then you push the [trolley] and find the food. You look at the [price] on the shelf. Small numbers mean cheap food.","At the till the [cashier] says hello in a [polite voice]. You pay and take your [receipt]. Then you say thank you and goodbye.","In a [role play] we use our voice, face and hands. Speak clearly. Smile. Move like a real shopper. That is good acting!"],"title":"Shopping Day Show","titleSk":"Divadlo o nakupovaní"},"robot":{"prompts":[{"answer":"Here are five: Hello. Where is the bread, please? How much is this? Can I pay by card? Thank you, goodbye. Say them with a smile and a polite voice.","bad":"shop words","goal":"Learn polite shop sentences","goalSk":"Naučiť sa zdvorilé vety v obchode","good":"Give me 5 polite English sentences a customer says in a supermarket, for a 10-year-old.","tip":"Clear questions say how many and for whom."},{"answer":"Step 1: Write a short shopping list. Step 2: The customer puts food in the trolley and asks the price. Step 3: The cashier says the total, takes money, gives the receipt.","bad":"role play?","goal":"Plan the role play","goalSk":"Naplánovať si hranie rolí","good":"Explain in 3 steps how to act a cashier and a customer in class.","tip":"Asking for 3 steps gives a short, easy answer."}],"statements":[{"explain":"Yes, the cashier scans the food and takes the payment.","ok":true,"text":"A cashier works at the till and takes your money."},{"explain":"A potato is a vegetable that grows in the ground and we eat it.","ok":false,"text":"A potato is a purple flower, so you put it in a vase."},{"explain":"A list helps shoppers remember every item.","ok":true,"text":"A shopping list helps you remember what to buy."},{"explain":"You get the receipt after you pay at the till.","ok":false,"text":"You get the receipt before you enter the supermarket."},{"explain":"In a role play you speak, use your face, voice and hands.","ok":false,"text":"In a role play you must stay silent and never move."}]},"sort":{"groups":[{"en":"Food you buy","id":"food","pic":"🍎"},{"en":"Shop things","id":"shop","pic":"🛒"}],"items":[{"en":"potato","group":"food","pic":"🥔"},{"en":"bread","group":"food","pic":"🍞"},{"en":"apple","group":"food","pic":"🍎"},{"en":"trolley","group":"shop","pic":"🛒"},{"en":"receipt","group":"shop","pic":"🧾"},{"en":"shopping list","group":"shop","pic":"📝"}]},"subject":"mad","test":[{"answer":"the cashier","options":["the cashier","the customer","the trolley"],"q":"Who takes your money in the shop?","qSk":"Kto v obchode berie peniaze?"},{"answer":"a paper with the prices you paid","options":["a paper with the prices you paid","a shopping bag","a kind of bread"],"q":"What is a 'receipt'?","qSk":"Čo je „receipt“?"},{"answer":"a shopping list","options":["a shopping list","a receipt","a price"],"q":"What do you write before shopping?","qSk":"Čo si napíšeš pred nákupom?"},{"answer":"true","options":["true","false"],"q":"A potato is a vegetable.","qSk":"Zemiak je zelenina."},{"answer":"bread, potato, apple","options":["bread, potato, apple","milk, fish, cake","tea, rice, eggs"],"q":"In the reading, what is in the list?","qSk":"Čo je v texte na zozname?"},{"answer":"how much money it costs","options":["how much money it costs","the shop door","a paper bag"],"q":"What does 'price' mean?","qSk":"Čo znamená „price“?"},{"answer":"true","options":["true","false"],"q":"You push a trolley in the supermarket.","qSk":"V supermarkete tlačíš vozík."},{"answer":"false","options":["true","false"],"q":"In a role play you never speak.","qSk":"Pri hraní rolí nikdy nehovoríš."}],"title":"Welcome to Billa","titleSk":"Vitajte v Bille","unit":"September","words":[{"en":"supermarket","ex":"We buy food in a big supermarket.","pic":"🏪","sk":"supermarket"},{"en":"cashier","ex":"The cashier sits behind the till.","pic":"🧑‍💼","sk":"pokladník / pokladníčka"},{"en":"customer","ex":"The customer pays for the bread.","pic":"🙋","sk":"zákazník"},{"en":"shopping list","ex":"I write milk on my shopping list.","pic":"📝","sk":"nákupný zoznam"},{"en":"trolley","ex":"Put the apples in the trolley.","pic":"🛒","sk":"nákupný vozík"},{"en":"receipt","ex":"The cashier gives me a receipt.","pic":"🧾","sk":"pokladničný blok"},{"en":"price","ex":"The price is two euros.","pic":"💶","sk":"cena"},{"en":"potato","ex":"I need one big potato, please.","pic":"🥔","sk":"zemiak"},{"en":"bread","ex":"Fresh bread smells very good.","pic":"🍞","sk":"chlieb"},{"en":"apple","ex":"This apple is red and sweet.","pic":"🍎","sk":"jablko"},{"en":"role play","ex":"We do a shop role play today.","pic":"🎭","sk":"hranie rolí"},{"en":"polite voice","ex":"Say please in a polite voice.","pic":"😊","sk":"zdvorilý hlas"}],"m":9,"month":"September"},{"draw":{"labels":["face","eye","mouth","eyebrow","sad"],"task":"Draw one happy face and one sad face. Label the parts.","taskSk":"Nakresli jednu šťastnú a jednu smutnú tvár. Označ časti."},"gaps":[{"answer":"oval","options":["oval","mirror","pencil"],"text":"First I draw a big ___ for the head."},{"answer":"nose","options":["nose","eyebrow","pencil"],"text":"The ___ is in the middle of the face."},{"answer":"happy","options":["happy","sad","angry"],"text":"A ___ mouth goes up like a smile."},{"answer":"eyebrow","options":["eyebrow","mirror","oval"],"text":"An angry face has a low ___."},{"answer":"mirror","options":["mirror","mouth","pencil"],"text":"I look in the ___ and make funny faces."}],"icon":"😀","id":"mad-03","intro":"You learn to draw a face and show feelings with it.","reading":{"paragraphs":["First take a [pencil]. Draw a big [oval]. This is the [face]. Draw a line across the middle. The eyes sit on this line.","Now draw one [eye] and then a second one. Draw the [nose] under the line. Draw the [mouth] under the [nose]. Add hair and ears.","Feelings live in the [eyebrow] and the [mouth]. A [happy] mouth goes up. A [sad] mouth goes down. An [angry] face has low eyebrows.","A [surprised] face is easy. The eyes are big. The mouth is a small circle. The eyebrows jump up high.","Look in a [mirror] and make funny faces. Then draw them. In the drama game, one child shows a feeling and friends copy it."],"title":"How to Draw a Face","titleSk":"Ako nakresliť tvár","titleSk2":null},"robot":{"prompts":[{"answer":"Step 1: draw an oval and a middle line. Step 2: draw two eyes with eyebrows going down to the nose. Step 3: draw a mouth that goes down.","bad":"angry face?","goal":"Learn to draw an angry face step by step","goalSk":"Naučiť sa krok za krokom nakresliť nahnevanú tvár","good":"Explain in 3 simple steps how to draw an angry face for a 10-year-old.","tip":"It says how many steps and who it is for."},{"answer":"Try the Feelings Mirror. One child shows a feeling with the face, like happy or scared. The other child copies it like a mirror. Then they swap roles.","bad":"game","goal":"Find a drama game about feelings","goalSk":"Nájsť dramatickú hru o pocitoch","good":"Give me one easy drama game about feelings for 9-year-old children, with an example.","tip":"Clear topic, age and an example give a useful answer."}],"statements":[{"explain":"Yes, most face drawings start with a simple oval shape.","ok":true,"text":"A good way to start a face is to draw an oval."},{"explain":"A sad mouth goes down at the corners; a happy mouth goes up.","ok":false,"text":"A sad mouth goes up at the corners, like a smile."},{"explain":"Eyebrows change a lot: they go down for angry and up for surprised.","ok":true,"text":"The eyebrows help to show feelings in a drawing."},{"explain":"A face has two eyes and one nose.","ok":false,"text":"A human face has only one eye and three noses."},{"explain":"Surprise shows with wide eyes, high eyebrows and a small open mouth.","ok":true,"text":"In a surprised face the eyes are big and the mouth is a small circle."}]},"sort":{"groups":[{"en":"Parts of the face","id":"parts","pic":"🙂"},{"en":"Feelings","id":"feelings","pic":"💭"}],"items":[{"en":"eye","group":"parts","pic":"👁️"},{"en":"nose","group":"parts","pic":"👃"},{"en":"mouth","group":"parts","pic":"👄"},{"en":"eyebrow","group":"parts","pic":"〰️"},{"en":"happy","group":"feelings","pic":"😄"},{"en":"sad","group":"feelings","pic":"😢"},{"en":"angry","group":"feelings","pic":"😠"},{"en":"surprised","group":"feelings","pic":"😲"}]},"subject":"mad","test":[{"answer":"obočie","options":["obočie","oko","ucho"],"q":"What does 'eyebrow' mean?","qSk":"Čo znamená 'eyebrow'?"},{"answer":"an oval","options":["an oval","a square","a star"],"q":"What shape do you draw first?","qSk":"Aký tvar kreslíš najskôr?"},{"answer":"under the nose","options":["under the nose","above the eyes","on the ear"],"q":"Where is the mouth?","qSk":"Kde sú ústa?"},{"answer":"true","options":["true","false"],"q":"A sad mouth goes down.","qSk":"Smutné ústa idú nadol."},{"answer":"prekvapený","options":["prekvapený","nahnevaný","unavený"],"q":"What does 'surprised' mean?","qSk":"Čo znamená 'surprised'?"},{"answer":"false","options":["true","false"],"q":"An angry face has high, jumping eyebrows.","qSk":"Nahnevaná tvár má vysoko zdvihnuté obočie."},{"answer":"a mirror","options":["a mirror","a pencil","a book"],"q":"What do you use to see your own funny face?","qSk":"Čo použiješ, aby si videl svoju smiešnu tvár?"},{"answer":"true","options":["true","false"],"q":"A face has two eyes.","qSk":"Tvár má dve oči."}],"title":"Funny Faces Show","titleSk":"Šou smiešnych tvárí","unit":"September","words":[{"en":"face","ex":"I draw a big round face.","pic":"🙂","sk":"tvár"},{"en":"oval","ex":"A face starts as an oval.","pic":"⭕","sk":"ovál"},{"en":"eye","ex":"One eye is on the left.","pic":"👁️","sk":"oko"},{"en":"eyebrow","ex":"An angry eyebrow goes down.","pic":"〰️","sk":"obočie"},{"en":"nose","ex":"The nose is in the middle.","pic":"👃","sk":"nos"},{"en":"mouth","ex":"A happy mouth looks like a smile.","pic":"👄","sk":"ústa"},{"en":"pencil","ex":"I draw with a soft pencil.","pic":"✏️","sk":"ceruzka"},{"en":"mirror","ex":"I make faces in the mirror.","pic":"🪞","sk":"zrkadlo"},{"en":"happy","ex":"A happy face has a big smile.","pic":"😄","sk":"šťastný"},{"en":"sad","ex":"A sad mouth goes down.","pic":"😢","sk":"smutný"},{"en":"angry","ex":"An angry face has low eyebrows.","pic":"😠","sk":"nahnevaný"},{"en":"surprised","ex":"A surprised mouth is a small circle.","pic":"😲","sk":"prekvapený"}],"m":9,"month":"September"},{"draw":{"labels":["sail","mast","flag","anchor","wave"],"task":"Draw a pirate ship on the sea. Label the parts you know.","taskSk":"Nakresli pirátsku loď na mori. Označ časti, ktoré poznáš."},"gaps":[{"answer":"sail","options":["sail","anchor","pencil"],"text":"The wind pushes the big white ___."},{"answer":"flag","options":["flag","rope","wave"],"text":"A black ___ flies on the top of the mast."},{"answer":"anchor","options":["anchor","sail","sketch"],"text":"The heavy ___ holds the ship in one place."},{"answer":"sketch","options":["sketch","rope","mast"],"text":"First I make a light ___ with a pencil."},{"answer":"wave","options":["wave","flag","mast"],"text":"The sea is not flat. Every ___ is curvy."}],"icon":"🏴‍☠️","id":"mad-04","intro":"You learn the parts of a pirate ship and simple drawing words.","reading":{"paragraphs":["A [pirate ship] is an old wooden ship. Pirates sailed on the sea long ago. Today we do not meet pirates, but we can draw their ship on paper.","Start with a light [sketch]. Draw the body of the ship first. Use a soft [pencil]. Press gently, so you can erase the lines later.","Now add a tall [mast]. Put a big [sail] on it. Tie the sail with a [rope]. On the top you can draw a small [crow's nest] and a black [flag].","At the front draw a heavy [anchor]. Under the ship draw the sea. Curvy lines make a [wave]. Finally draw the [outline] with a darker line and [shade] the dark parts."],"title":"Draw a Pirate Ship, Step by Step","titleSk":"Kreslíme pirátsku loď krok za krokom","titleSk2":null},"robot":{"prompts":[{"answer":"1. Draw the ship body like a banana. 2. Add a tall mast. 3. Add two sails. 4. Add a flag and an anchor. 5. Draw waves under the ship.","bad":"ship?","goal":"Learn to draw a ship in easy steps.","goalSk":"Naučiť sa nakresliť loď v jednoduchých krokoch.","good":"How do I draw a pirate ship in 5 easy steps for a 10-year-old?","tip":"It says who you are and how many steps you want."},{"answer":"A crow's nest is a small basket high on the mast. A sailor stands in it and looks far away. Example: he sees land or another ship first.","bad":"nest","goal":"Find out what the crow's nest is for.","goalSk":"Zistiť, načo slúži hliadkový kôš.","good":"What is a crow's nest on a ship? Explain simply and give an example.","tip":"Clear question with a topic and a request for an example."}],"statements":[{"explain":"Yes, the sail hangs on the tall mast.","ok":true,"text":"Pirate ships have a tall mast that holds the sail."},{"explain":"An anchor is heavy and it sinks to hold the ship.","ok":false,"text":"The anchor is light like paper, so it floats on the water."},{"explain":"A light sketch is easy to erase and fix.","ok":true,"text":"It is good to start your drawing with a light sketch."},{"explain":"Waves are curvy lines under the ship.","ok":true,"text":"Pirate ships sail on the sea, so you draw waves under the ship."},{"explain":"The crow's nest is a small basket high on the mast for watching.","ok":false,"text":"The crow's nest is a small kitchen at the bottom of the ship."}],"statementsNote":null},"sort":{"groups":[{"en":"Parts of the ship","id":"ship","pic":"🚢"},{"en":"Drawing words","id":"art","pic":"✏️"}],"items":[{"en":"mast","group":"ship","pic":"🪵"},{"en":"sail","group":"ship","pic":"⛵"},{"en":"anchor","group":"ship","pic":"⚓"},{"en":"crow's nest","group":"ship","pic":"🪺"},{"en":"pencil","group":"art","pic":"✏️"},{"en":"sketch","group":"art","pic":"📝"},{"en":"outline","group":"art","pic":"⭕"},{"en":"shade","group":"art","pic":"🌑"}]},"subject":"mad","test":[{"answer":"plachta","options":["plachta","kotva","vlna"],"q":"What is a 'sail'?","qSk":"Čo je „sail“?"},{"answer":"kotva","options":["kotva","stožiar","ceruzka"],"q":"What is an 'anchor'?","qSk":"Čo je „anchor“?"},{"answer":"on the mast","options":["on the mast","under the sea","on the anchor"],"q":"Where does the flag fly?","qSk":"Kde vlaje vlajka?"},{"answer":"a light sketch","options":["a light sketch","the dark shade","the waves"],"q":"What do you draw first?","qSk":"Čo kreslíš ako prvé?"},{"answer":"true","options":["true","false"],"q":"The crow's nest is high on the mast.","qSk":"Hliadkový kôš je vysoko na stožiari."},{"answer":"false","options":["true","false"],"q":"An anchor is very light and floats.","qSk":"Kotva je veľmi ľahká a pláva."},{"answer":"true","options":["true","false"],"q":"Waves are curvy lines under the ship.","qSk":"Vlny sú vlnité čiary pod loďou."},{"answer":"tieňovať","options":["tieňovať","gumovať","strihať"],"q":"What does 'shade' mean?","qSk":"Čo znamená „shade“?"}],"title":"Draw a Pirate Ship","titleSk":"Ako nakresliť pirátsku loď","unit":"September","words":[{"en":"pirate ship","ex":"The pirate ship sails on the blue sea.","pic":"🚢","sk":"pirátska loď"},{"en":"sail","ex":"The wind pushes the big white sail.","pic":"⛵","sk":"plachta"},{"en":"mast","ex":"The mast is a tall wooden pole.","pic":"🪵","sk":"stožiar"},{"en":"flag","ex":"A black flag flies on the mast.","pic":"🏴","sk":"vlajka"},{"en":"anchor","ex":"The heavy anchor stops the ship.","pic":"⚓","sk":"kotva"},{"en":"rope","ex":"Sailors pull the thick rope.","pic":"🪢","sk":"lano"},{"en":"crow's nest","ex":"A pirate watches from the crow's nest.","pic":"🪺","sk":"hliadkový kôš"},{"en":"wave","ex":"A big wave hits the ship.","pic":"🌊","sk":"vlna"},{"en":"pencil","ex":"I draw with a grey pencil.","pic":"✏️","sk":"ceruzka"},{"en":"sketch","ex":"First I make a light sketch.","pic":"📝","sk":"náčrt, skica"},{"en":"outline","ex":"I draw the outline of the ship.","pic":"⭕","sk":"obrys"},{"en":"shade","ex":"I shade the sail to make it dark.","pic":"🌑","sk":"tieňovať"}],"m":9,"month":"September"},{"draw":{"labels":["aunt","uncle","kitchen","camera"],"task":"Draw your aunt and uncle in a kitchen with a camera.","taskSk":"Nakresli svoju tetu a strýka v kuchyni s fotoaparátom."},"gaps":[{"answer":"who","options":["who","which","where"],"text":"She is the girl ___ plays football."},{"answer":"which","options":["which","who","where"],"text":"This is the bike ___ is new."},{"answer":"where","options":["where","which","who"],"text":"That is the room ___ we sleep."},{"answer":"aunt","options":["aunt","uncle","cousin"],"text":"My ___ is my mother's sister."},{"answer":"pilot","options":["pilot","nurse","neighbour"],"text":"A ___ flies a plane."}],"icon":"🔗","id":"kidsbox-01","intro":"You will join two short sentences with who, which and where.","reading":{"paragraphs":["Hello! I am Mia. I use three small words to join sentences. I use [who] for people. I use [which] for things. I use [where] for places.","My [aunt] is the woman [who] works in a hospital. She is a [nurse]. My [uncle] is the man [who] flies planes. He is a [pilot].","My [cousin] has a [camera] [which] is very old. It still works! My [grandparents] have a [kitchen] [where] we make cakes on Sunday.","Our [neighbour] is the man [who] has two dogs. He is the person [who] helps us in the garden. I like my big family."],"title":"My Family Words","titleSk":"Slová o mojej rodine"},"robot":{"prompts":[{"answer":"Use 'who' for people and 'which' for things. Example: The boy who runs fast is my cousin. Example: The camera which is old still works.","bad":"who which?","goal":"Understand when to use who and which","goalSk":"Pochopiť, kedy použiť who a kedy which","good":"Explain for a 10-year-old when to use 'who' and 'which', with two examples.","tip":"Say your age and ask for examples."},{"answer":"My aunt is the woman who cooks well. This is the photo which I like. That is the house where my grandparents live.","bad":"family sentences","goal":"Make practice sentences about family","goalSk":"Vytvoriť cvičné vety o rodine","good":"Give me 3 easy sentences about my family using 'who', 'which' and 'where'.","tip":"Clear number and clear words give better help."}],"statements":[{"explain":"Yes, 'who' is for people, like my aunt or my friend.","ok":true,"text":"We use 'who' when we talk about people."},{"explain":"It is the opposite: 'who' is for people, 'which' is for things.","ok":false,"text":"We use 'which' for people and 'who' for things."},{"explain":"Correct, 'where' shows a place.","ok":true,"text":"We use 'where' to talk about a place, like a kitchen."},{"explain":"They can also join two sentences, like 'the man who helps us'.","ok":false,"text":"'Who', 'which' and 'where' always start a question."},{"explain":"Yes, and his wife is your aunt.","ok":true,"text":"Your uncle is your father's or mother's brother."}]},"sort":{"groups":[{"en":"who (people)","id":"people","pic":"🧑"},{"en":"which (things)","id":"things","pic":"📦"},{"en":"where (places)","id":"places","pic":"📍"}],"items":[{"en":"aunt","group":"people","pic":"👩"},{"en":"pilot","group":"people","pic":"👨‍✈️"},{"en":"neighbour","group":"people","pic":"🏠"},{"en":"camera","group":"things","pic":"📷"},{"en":"bike","group":"things","pic":"🚲"},{"en":"kitchen","group":"places","pic":"🍳"},{"en":"park","group":"places","pic":"🌳"},{"en":"school","group":"places","pic":"🏫"}]},"subject":"kidsbox","test":[{"answer":"who","options":["who","which","where"],"q":"Which word do we use for people?","qSk":"Ktoré slovo používame pre osoby?"},{"answer":"where","options":["where","who","which"],"q":"Which word do we use for places?","qSk":"Ktoré slovo používame pre miesta?"},{"answer":"teta","options":["teta","strýko","sused"],"q":"What does 'aunt' mean in Slovak?","qSk":"Čo znamená 'aunt' po slovensky?"},{"answer":"a nurse","options":["a nurse","a pilot","a teacher"],"q":"In the text, what is Mia's aunt?","qSk":"Čo je v texte Miina teta?"},{"answer":"an old camera","options":["an old camera","a new bike","two dogs"],"q":"What does Mia's cousin have?","qSk":"Čo má Miin bratranec?"},{"answer":"true","options":["true","false"],"q":"We use 'which' for things.","qSk":"'Which' používame pre veci."},{"answer":"true","options":["true","false"],"q":"Mia's grandparents have a kitchen where they make cakes.","qSk":"Miini starí rodičia majú kuchyňu, kde pečú koláče."},{"answer":"false","options":["true","false"],"q":"A pilot works in a hospital.","qSk":"Pilot pracuje v nemocnici."}],"title":"Who, Which, Where","titleSk":"Vety so vzťažnými zámenami","unit":"Hello there","words":[{"en":"who","ex":"She is the girl who sings well.","pic":"🧑","sk":"ktorý (o osobe)"},{"en":"which","ex":"This is the bag which is very big.","pic":"📦","sk":"ktorý (o veci)"},{"en":"where","ex":"That is the park where we play.","pic":"📍","sk":"kde"},{"en":"cousin","ex":"My cousin lives in Košice.","pic":"👦","sk":"bratranec/sesternica"},{"en":"aunt","ex":"My aunt makes good soup.","pic":"👩","sk":"teta"},{"en":"uncle","ex":"My uncle drives a red car.","pic":"👨","sk":"strýko"},{"en":"grandparents","ex":"My grandparents have a small garden.","pic":"👵","sk":"starí rodičia"},{"en":"neighbour","ex":"Our neighbour is very friendly.","pic":"🏠","sk":"sused"},{"en":"nurse","ex":"A nurse helps sick people.","pic":"👩‍⚕️","sk":"zdravotná sestra"},{"en":"pilot","ex":"The pilot flies a big plane.","pic":"👨‍✈️","sk":"pilot"},{"en":"kitchen","ex":"We eat dinner in the kitchen.","pic":"🍳","sk":"kuchyňa"},{"en":"camera","ex":"My camera takes nice photos.","pic":"📷","sk":"fotoaparát"}],"m":9,"month":"September"},{"draw":{"labels":["wake up","walk to school","play football","go to bed"],"task":"Draw your day: you in bed, at school and with a ball.","taskSk":"Nakresli svoj deň: seba v posteli, v škole a s loptou."},"gaps":[{"answer":"always","options":["always","never","sometimes"],"text":"I ___ wake up at seven. I do it every day."},{"answer":"never","options":["never","always","sometimes"],"text":"I ___ eat fish. I don't like it at all."},{"answer":"sometimes","options":["sometimes","always","never"],"text":"I ___ play in the park, but not every day."},{"answer":"brush","options":["brush","read","walk"],"text":"We always ___ our teeth after breakfast."},{"answer":"go","options":["go","have","do"],"text":"I never ___ to bed at six o'clock."}],"icon":"⏰","id":"kidsbox-02","intro":"You will learn to say how often you do things with always, sometimes and never.","reading":{"paragraphs":["Hello! I am Emma. I am nine. I [always] [wake up] at seven o'clock. Then I [brush my teeth] and I [have breakfast]. I love warm milk and bread.","I [always] [walk to school] with my friend Tom. School starts at eight. I am [never] late, because my dad is a very fast walker!","After school I [do homework]. Then I [sometimes] [play football] in the park. I [never] play football when it rains. Then I [read a book] at home.","On Saturday I [tidy my room]. I [sometimes] help my mum in the kitchen too. I [always] [go to bed] at eight o'clock. Good night!"],"title":"My Day","titleSk":"Môj deň"},"robot":{"prompts":[{"answer":"Put 'always' before the main verb: I always walk to school. After am, is, are put it after: She is always happy. Two examples: I always read. He is always kind.","bad":"always?","goal":"Learn where to put the word 'always' in a sentence.","goalSk":"Zistiť, kam v vete patrí slovo „always“.","good":"Where do I put 'always' in an English sentence? Explain for a 10-year-old and give two examples.","tip":"It says the word, your age and asks for examples."},{"answer":"1. I never sleep in class. 2. We never run in the corridor. 3. My teacher is never angry in the morning.","bad":"never sentences","goal":"Get practice sentences with never.","goalSk":"Získať vety na precvičenie so slovom „never“.","good":"Give me 3 easy sentences with 'never' about school for a 10-year-old learner.","tip":"It says how many, which topic and how easy."}],"statements":[{"explain":"Always is 100% of the time and never is 0% of the time.","ok":true,"text":"Always means every time, and never means not one time."},{"explain":"The adverb goes before the main verb: I always play football.","ok":false,"text":"You must say: I play always football."},{"explain":"After to be we say: I am never late, she is always happy.","ok":true,"text":"With am, is and are the adverb goes after the verb: I am never late."},{"explain":"Sometimes means only on some days, not every day.","ok":false,"text":"Sometimes means the same as always."},{"explain":"Sometimes can stand at the start of the sentence.","ok":true,"text":"You can also start a sentence with Sometimes: Sometimes I read a book."}]},"sort":{"groups":[{"en":"Morning","id":"morning","pic":"🌅"},{"en":"Evening","id":"evening","pic":"🌙"}],"items":[{"en":"wake up","group":"morning","pic":"🌅"},{"en":"have breakfast","group":"morning","pic":"🥣"},{"en":"walk to school","group":"morning","pic":"🚶"},{"en":"brush my teeth","group":"morning","pic":"🪥"},{"en":"do homework","group":"evening","pic":"📚"},{"en":"read a book","group":"evening","pic":"📖"},{"en":"tidy my room","group":"evening","pic":"🧹"},{"en":"go to bed","group":"evening","pic":"🛏️"}]},"subject":"kidsbox","test":[{"answer":"vždy","options":["vždy","nikdy","niekedy"],"q":"What does 'always' mean in Slovak?","qSk":"Čo znamená „always“ po slovensky?"},{"answer":"nikdy","options":["nikdy","vždy","často"],"q":"What does 'never' mean in Slovak?","qSk":"Čo znamená „never“ po slovensky?"},{"answer":"I always do homework.","options":["I always do homework.","I do always homework.","Always I do homework not."],"q":"Which sentence is correct?","qSk":"Ktorá veta je správna?"},{"answer":"true","options":["true","false"],"q":"Emma wakes up at seven o'clock.","qSk":"Emma sa budí o siedmej."},{"answer":"true","options":["true","false"],"q":"Emma walks to school with Tom.","qSk":"Emma ide do školy s Tomom."},{"answer":"false","options":["true","false"],"q":"Emma plays football when it rains.","qSk":"Emma hrá futbal, keď prší."},{"answer":"On Saturday","options":["On Saturday","On Monday","Never"],"q":"When does Emma tidy her room?","qSk":"Kedy si Emma upratuje izbu?"},{"answer":"She is never late.","options":["She is never late.","She never is late.","She is late never."],"q":"Choose the correct sentence with 'to be'.","qSk":"Vyber správnu vetu so slovesom „to be“."}],"title":"Always, Sometimes, Never","titleSk":"Vždy, niekedy, nikdy","unit":"Hello there","words":[{"en":"always","ex":"I always wake up at seven o'clock.","pic":"⏰","sk":"vždy"},{"en":"sometimes","ex":"Sometimes I play football after school.","pic":"🌤 /* ===== Pomocné funkcie ===== */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const pic = p => { p = String(p || "⭐"); return p.startsWith("svg:") ? (SVG[p.slice(4)] || "⭐") : esc(p); };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const starsFor = (s, t) => !t ? 0 : s >= t * .9 ? 3 : s >= t * .7 ? 2 : s >= t * .5 ? 1 : 0;

/* Výslovnosť – hlas zabudovaný v tablete */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text), v = speechSynthesis.getVoices();
    u.voice = v.find(x => x.lang === "en-GB") || v.find(x => x.lang.startsWith("en")) || null;
    u.lang = "en-GB"; u.rate = .85; speechSynthesis.speak(u);
  } catch (e) {}
}

/* ===== Pokrok žiaka (uložený v tablete) ===== */
const KEY = "clil4-progress";
let P = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
P.lessons = P.lessons || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
const LP = id => (P.lessons[id] = P.lessons[id] || { learn:false, read:false, practice:false, draw:false, robot:false, best:0 });
const STEPS = ["learn", "read", "practice", "draw", "robot"];
const stepsDone = lp => STEPS.filter(k => lp[k]).length + (lp.best ? 1 : 0);   // z 6

/* ===== Chyby na opakovanie =====
   Každá chyba (test, doplňovačka, spájačka, triedenie, robot) sa uloží ako otázka.
   V „Practise my mistakes“ ju treba 2× za sebou zodpovedať správne, potom zmizne. */
P.mistakes = P.mistakes || [];
function addMistake(m) {
  m.id = (S.lesson || "") + "|" + m.q + "|" + m.answer;
  m.lesson = S.lesson; m.need = 2;
  const old = P.mistakes.find(x => x.id === m.id);
  if (old) old.need = 2; else P.mistakes.push(m);
  if (P.mistakes.length > 200) P.mistakes.shift();
  save();
}
const wordQ = w => ({ pic: w.pic, q: "What is it?", qSk: "Čo je na obrázku?", answer: w.en,
  options: [w.en, ...shuffle(L().words.filter(x => x !== w)).slice(0, 2).map(x => x.en)] });

/* Kresby – každá lekcia má vlastný kľúč (obrázky sú väčšie) */
const DKEY = id => "clil4-draw-" + id;
const loadDrawing = id => { try { return localStorage.getItem(DKEY(id)); } catch (e) { return null; } };
document.body.classList.toggle("show-sk", !!P.sk);

/* ===== Stav ===== */
let S = { screen: "home", subject: null, lesson: null };
const L = () => APP.lessons.find(x => x.id === S.lesson);
const TEST_TOTAL = () => Math.min(10, (L().test || []).length + 2);

function go(screen, extra = {}) {
  S = Object.assign({ screen, subject: S.subject, lesson: S.lesson }, extra);
  if (screen === "practice") setupPractice();
  if (screen === "robot") { const R = L().robot || {}; S.rOrder = null; S.r = { part: (R.statements||[]).length ? 0 : (R.prompts||[]).length ? 1 : -1, i: 0, pick: null }; if (S.r.part === -1) { LP(S.lesson).robot = true; save(); } }
  if (screen === "test") setupTest();
  if (screen === "mistakes") setupMistakes();
  if (screen === "draw") S.dr = { color: "#1D2A5B", size: 8, label: null, used: [] };
  render(); window.scrollTo(0, 0);
  if (screen === "draw") initCanvas();
}

function topbar(back) {
  return `<div class="topbar">
    ${back ? `<button class="iconbtn" data-a="go" data-to="${back}" aria-label="Back">${back === "home" ? "🏠" : "◀"}</button>` : ""}
    <div class="spacer"></div>
    <button class="iconbtn" data-a="sk" aria-pressed="${!!P.sk}">🇸🇰 SK</button>
  </div>`;
}

/* ===== DOMOV =====
   Všetky lekcie sú viditeľné. Lekcie aktuálneho mesiaca sú hore a zvýraznené. */
const NOW_M = new Date().getMonth() + 1;
function lessonCard(l, hot) {
  const lp = LP(l.id), st = starsFor(lp.best, Math.min(10, (l.test || []).length + 2));
  const done = stepsDone(lp);
  return `<button class="lesson ${hot ? "hot" : ""}" data-a="open" data-id="${esc(l.id)}">
    <span class="ico">${pic(l.icon || (l.words && l.words[0] && l.words[0].pic))}</span>
    <span><h3>${esc(l.title)}</h3><p>${done === 6 ? "Finished ✓" : `${done}/6 steps done`}<span class="sk"> · ${esc(l.titleSk || "")}</span></p></span>
    <span class="st">${st ? "⭐".repeat(st) : "▶"}</span></button>`;
}
function renderHome() {
  const subs = APP.subjects.filter(s => APP.lessons.some(l => l.subject === s.key));
  if (!subs.length) return topbar() + `<div class="empty">No lessons yet.<br><span class="sk">Zatiaľ tu nie sú žiadne lekcie.</span></div>`;
  if (!subs.find(s => s.key === S.subject)) S.subject = (subs.find(s => APP.lessons.some(l => l.subject === s.key && l.m === NOW_M)) || subs[0]).key;
  const list = APP.lessons.filter(l => l.subject === S.subject);
  const now = list.filter(l => l.m === NOW_M), rest = list.filter(l => l.m !== NOW_M);
  let html = "";
  if (now.length) html += `<section class="now"><div class="now-title">⭐ This month: ${esc(now[0].month || "")}<span class="sk"> · Tento mesiac</span></div>
    <div class="lessons">${now.map(l => lessonCard(l, true)).join("")}</div></section>`;
  let grp = null;
  html += `<div class="lessons">`;
  rest.forEach(l => {
    if (l.month !== grp) { grp = l.month; html += `<div class="unit-title">${esc(grp || "")}</div>`; }
    html += lessonCard(l, false);
  });
  html += `</div>`;
  return topbar() + `<div class="hello"><h1>My lessons</h1><p>Choose a subject and a lesson.<br><span class="sk">Vyber si predmet a lekciu.</span></p></div>
    <div class="tabs" role="tablist">${subs.map(s => {
      const hasNow = APP.lessons.some(l => l.subject === s.key && l.m === NOW_M);
      return `<button class="tab" role="tab" aria-selected="${s.key === S.subject}" data-a="subj" data-k="${s.key}">${esc(s.name)}${hasNow ? " ⭐" : ""}</button>`; }).join("")}</div>
    <div class="home-actions">
      <button class="big ${P.mistakes.length ? "fix" : "ghost"}" data-a="go" data-to="mistakes" ${P.mistakes.length ? "" : "disabled"}>🔁 My mistakes (${P.mistakes.length})</button>
      <button class="big ghost" data-a="go" data-to="progress">📊 My progress</button>
    </div>
    ${html}`;
}

/* ===== LEKCIA – 5 krokov ===== */
function renderLesson() {
  const l = L(), lp = LP(l.id), st = starsFor(lp.best, TEST_TOTAL());
  const steps = [
    { id:"learn", t:"Learn the words", sk:"Nauč sa slovíčka", d:`${l.words.length} words`, done:lp.learn },
    { id:"read", t:"Read", sk:"Čítaj", d:"A short text", done:lp.read },
    { id:"practice", t:"Practice", sk:"Precvičuj", d:"Match and fill in", done:lp.practice },
    { id:"draw", t:"Draw it", sk:"Nakresli", d:"Draw and label a picture", done:lp.draw },
    { id:"robot", t:"Check the robot", sk:"Skontroluj robota", d:"Robots make mistakes too!", done:lp.robot, robot:true },
    { id:"test", t:"Test", sk:"Test", d:lp.best ? `Best: ${lp.best}/${TEST_TOTAL()}` : `${TEST_TOTAL()} questions`, done:lp.best > 0 }
  ];
  return topbar(APP.single ? null : "home") + `
    <div class="hero"><div class="hero-pic">${pic(l.icon || l.words[0].pic)}</div>
      <div><h1>${esc(l.title)}</h1><p class="sk">${esc(l.titleSk || "")}</p>${l.intro ? `<p>${esc(l.intro)}</p>` : ""}</div></div>
    <div class="path">${steps.map((s, i) => `
      <button class="step ${s.done ? "done" : ""} ${s.robot ? "robot" : ""}" data-a="go" data-to="${s.id}">
        <span class="num">${s.done ? "✓" : s.robot ? "🤖" : i + 1}</span>
        <span><h2>${s.t}</h2><p><span class="sk">${s.sk}. </span>${s.d}</p></span>
        <span class="go">${s.id === "test" && st ? "⭐".repeat(st) : "▶"}</span></button>`).join("")}</div>`;
}

/* ===== LEARN ===== */
function renderLearn() {
